[build-system]
requires = ["setuptools==69.0.2", "wheel==0.42.0"]
build-backend = "setuptools.build_meta"

[project]
name = "immunovlm"
version = "0.1.0"
description = "Topology-preserving multimodal alignment for autoimmune tissue diagnostics"
requires-python = "==3.10.12"
dependencies = [
  "torch==2.1.0",
  "torchvision==0.16.0",
  "transformers==4.36.0",
  "scanpy==1.9.6",
  "anndata==0.10.3",
  "scikit-learn==1.3.2",
  "scipy==1.11.4",
  "numpy==1.26.2",
  "pandas==2.1.3",
  "Pillow==10.1.0",
  "opencv-python-headless==4.8.1.78",
  "omegaconf==2.3.0",
  "PyYAML==6.0.1",
  "tqdm==4.66.1",
  "safetensors==0.4.1"
]

[project.scripts]
immunovlm-train = "immunovlm.commands.train:main"
immunovlm-evaluate = "immunovlm.commands.evaluate:main"
immunovlm-prepare = "immunovlm.commands.prepare:main"

[tool.setuptools]
package-dir = {"" = "code"}

[tool.setuptools.packages.find]
where = ["code"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unreachable = true
plugins = ["numpy.typing.mypy_plugin"]

